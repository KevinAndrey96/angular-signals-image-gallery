name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint TypeScript and templates
        run: npm run lint

      - name: Unit tests with coverage thresholds
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the production image
        run: docker build -t angular-signals-image-gallery .

      - name: Boot a read-only container
        run: |
          docker run -d --name web -p 8080:8080 \
            --read-only --tmpfs /tmp \
            --security-opt no-new-privileges:true \
            angular-signals-image-gallery

      - name: Smoke test
        run: bin/smoke-test http://localhost:8080

      - name: Container logs
        if: always()
        run: docker logs web
