version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Angular 22 supports TypeScript ~6.0 only; majors arrive with Angular updates.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
      tooling:
        patterns:
          - '*'
        exclude-patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
